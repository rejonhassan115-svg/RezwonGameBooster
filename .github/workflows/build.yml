          package com.rezwon.gamebooster

          import android.animation.ObjectAnimator
          import android.animation.ValueAnimator
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Bundle
          import android.os.SystemClock
          import android.view.Choreographer
          import android.view.animation.LinearInterpolator
          import android.widget.Toast
          import androidx.activity.enableEdgeToEdge
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.lifecycleScope
          import androidx.lifecycle.repeatOnLifecycle
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.AdSize
          import com.google.android.gms.ads.AdView
          import com.google.android.gms.ads.FullScreenContentCallback
          import com.google.android.gms.ads.LoadAdError
          import com.google.android.gms.ads.interstitial.InterstitialAd
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
          import com.rezwon.gamebooster.databinding.ActivityMainBinding
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private var bannerAdView: AdView? = null
              private var interstitialAd: InterstitialAd? = null
              private var lastInterstitialShownMs: Long = 0L
              private var isBoosting: Boolean = false
              private var ringAnimator: ObjectAnimator? = null
              private var pulseAnimator: ValueAnimator? = null
              private var frameCount = 0
              private var lastFpsTimestampNs = 0L
              private var currentFps = 60

              private val frameCallback = object : Choreographer.FrameCallback {
                  override fun doFrame(frameTimeNanos: Long) {
                      if (lastFpsTimestampNs == 0L) lastFpsTimestampNs = frameTimeNanos
                      frameCount++
                      val elapsedNs = frameTimeNanos - lastFpsTimestampNs
                      if (elapsedNs >= 1_000_000_000L) {
                          currentFps = ((frameCount * 1_000_000_000.0) / elapsedNs).toInt().coerceAtLeast(1)
                          binding.tvFpsValue.text = "$currentFps FPS"
                          frameCount = 0
                          lastFpsTimestampNs = frameTimeNanos
                      }
                      Choreographer.getInstance().postFrameCallback(this)
                  }
              }

              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      updateBatteryUi(SystemMonitor.parseBatteryIntent(intent))
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  installSplashScreen()
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  ViewCompat.setOnApplyWindowInsetsListener(binding.rootLayout) { v, insets ->
                      val bars = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      v.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                      insets
                  }

                  setupStaticDeviceHeader()
                  setupReactorAnimations()
                  setupControls()
                  setupAds()
                  startTelemetryLoop()
              }

              override fun onResume() {
                  super.onResume()
                  bannerAdView?.resume()
                  val stickyBattery = registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  updateBatteryUi(SystemMonitor.parseBatteryIntent(stickyBattery))
                  refreshFreeFireCard()
                  frameCount = 0
                  lastFpsTimestampNs = 0L
                  Choreographer.getInstance().postFrameCallback(frameCallback)
              }

              override fun onPause() {
                  bannerAdView?.pause()
                  Choreographer.getInstance().removeFrameCallback(frameCallback)
                  try { unregisterReceiver(batteryReceiver) } catch (_: IllegalArgumentException) { }
                  super.onPause()
              }

              override fun onDestroy() {
                  ringAnimator?.cancel()
                  pulseAnimator?.cancel()
                  bannerAdView?.destroy()
                  super.onDestroy()
              }

              private fun setupStaticDeviceHeader() {
                  val cpu = SystemMonitor.getCpuSnapshot(this)
                  binding.tvDeviceHeader.text = "${cpu.deviceLabel} • ${cpu.maxRefreshHz}Hz Display"
                  OptimizationEngine.applyHighRefreshRate(this, true)
              }

              private fun setupReactorAnimations() {
                  ringAnimator = ObjectAnimator.ofFloat(binding.ringOuter, "rotation", 0f, 360f).apply {
                      duration = 9000L
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      start()
                  }
                  pulseAnimator = ValueAnimator.ofFloat(0.97f, 1.03f).apply {
                      duration = 1600L
                      repeatMode = ValueAnimator.REVERSE
                      repeatCount = ValueAnimator.INFINITE
                      addUpdateListener { anim ->
                          val scale = anim.animatedValue as Float
                          binding.btnBoost.scaleX = scale
                          binding.btnBoost.scaleY = scale
                      }
                      start()
                  }
              }

              private fun setupControls() {
                  binding.btnBoost.setOnClickListener {
                      if (!isBoosting) triggerOneTapBoost()
                  }
                  binding.switchGamingMode.setOnCheckedChangeListener { buttonView, isChecked ->
                      OptimizationEngine.applyKeepScreenOn(this, isChecked)
                      when (OptimizationEngine.setGamingDnd(this, isChecked)) {
                          DndStatus.ENABLED -> Toast.makeText(this, "Gaming Mode & Focus Shield ON", Toast.LENGTH_SHORT).show()
                          DndStatus.DISABLED -> Toast.makeText(this, "Gaming Mode OFF", Toast.LENGTH_SHORT).show()
                          DndStatus.NEEDS_PERMISSION -> {
                              if (isChecked) {
                                  Toast.makeText(this, "Grant Do Not Disturb access to silence alerts while gaming", Toast.LENGTH_LONG).show()
                                  OptimizationEngine.openDndSettings(this)
                              }
                              buttonView.isChecked = false
                          }
                      }
                  }
                  binding.switch120Hz.setOnCheckedChangeListener { _, isChecked ->
                      OptimizationEngine.applyHighRefreshRate(this, isChecked)
                  }
                  binding.switchBrightness.setOnCheckedChangeListener { _, isChecked ->
                      OptimizationEngine.applyHighBrightness(this, isChecked)
                  }
                  binding.cardFreeFireLaunch.setOnClickListener {
                      lifecycleScope.launch {
                          binding.tvBoostStatus.text = "Preparing Gaming Mode for Free Fire..."
                          OptimizationEngine.applyHighRefreshRate(this@MainActivity, binding.switch120Hz.isChecked)
                          OptimizationEngine.runSafeOptimization(this@MainActivity)
                          val launched = OptimizationEngine.launchFreeFireOrStore(this@MainActivity)
                          if (!launched) Toast.makeText(this@MainActivity, "Free Fire not found — opening Play Store", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun triggerOneTapBoost() {
                  isBoosting = true
                  binding.tvBoostButton.text = "OPTIMIZING"
                  binding.tvBoostStatus.text = "Trimming app cache & aligning gaming profile..."
                  ringAnimator?.duration = 1400L

                  lifecycleScope.launch {
                      val report = OptimizationEngine.runSafeOptimization(this@MainActivity)
                      binding.tvBoostButton.text = "BOOSTED"
                      binding.tvBoostStatus.text = report.summary
                      ringAnimator?.duration = 9000L
                      updateRamAndStorageUi()
                      isBoosting = false
                      maybeShowInterstitialAfterBoost()
                      delay(3500)
                      if (!isBoosting) binding.tvBoostButton.text = "ONE-TAP\nBOOST"
                  }
              }

              private fun startTelemetryLoop() {
                  lifecycleScope.launch {
                      repeatOnLifecycle(Lifecycle.State.STARTED) {
                          while (true) {
                              updateRamAndStorageUi()
                              updateCpuUi()
                              updateNetworkUi()
                              delay(2500L)
                          }
                      }
                  }
              }

              private fun updateRamAndStorageUi() {
                  val mem = SystemMonitor.getMemorySnapshot(this)
                  binding.tvRamPercent.text = "${mem.usedPercent}%"
                  binding.progressRam.progress = mem.usedPercent
                  binding.tvRamDetail.text = String.format(Locale.US, "%.1f / %.1f GB (%.1f GB free)", mem.usedGb, mem.totalGb, mem.availGb)

                  val storage = SystemMonitor.getStorageSnapshot()
                  binding.tvStorageFree.text = String.format(Locale.US, "%.1f GB Free", storage.freeGb)
                  binding.progressStorage.progress = storage.usedPercent
                  binding.tvStorageDetail.text = String.format(Locale.US, "%.0f / %.0f GB used", storage.usedGb, storage.totalGb)
              }

              private fun updateCpuUi() {
                  val cpu = SystemMonitor.getCpuSnapshot(this)
                  binding.tvCpuCores.text = "${cpu.cores} Cores • ${cpu.maxRefreshHz}Hz"
                  binding.tvCpuFreq.text = if (cpu.currentFreqMhz != null && cpu.maxFreqMhz != null) {
                      "Clock: ${cpu.currentFreqMhz} / ${cpu.maxFreqMhz} MHz"
                  } else {
                      "Clock: Managed by Android OS"
                  }
              }

              private fun updateBatteryUi(battery: BatterySnapshot) {
                  binding.tvBatteryTemp.text = if (battery.tempCelsius != null) String.format(Locale.US, "%.1f °C", battery.tempCelsius) else "N/A"
                  val tempColor = when (battery.thermalStatus) {
                      "HOT" -> ContextCompat.getColor(this, R.color.red_hot)
                      "WARM" -> ContextCompat.getColor(this, R.color.amber_warn)
                      else -> ContextCompat.getColor(this, R.color.neon_green)
                  }
                  binding.tvBatteryTemp.setTextColor(tempColor)
                  val chargeState = if (battery.isCharging) "Charging" else "Discharging"
                  binding.tvBatteryDetail.text = "Level: ${battery.levelPercent}% • $chargeState (${battery.thermalStatus})"
              }

              private suspend fun updateNetworkUi() {
                  val net = SystemMonitor.getNetworkSnapshot(this)
                  if (!net.isConnected) {
                      binding.tvNetworkStatus.text = "Offline"
                      binding.tvNetworkDetail.text = "No active internet connection"
                      binding.tvPingBadge.text = "-- ms"
                      binding.tvPingBadge.setTextColor(ContextCompat.getColor(this, R.color.red_hot))
                      return
                  }
                  binding.tvNetworkStatus.text = net.transportLabel
                  binding.tvNetworkDetail.text = String.format(Locale.US, "Est. Link: %.1f Mbps", net.downMbps)
                  if (net.pingMs != null) {
                      binding.tvPingBadge.text = "${net.pingMs} ms"
                      val pingColor = when {
                          net.pingMs <= 70 -> ContextCompat.getColor(this, R.color.neon_green)
                          net.pingMs <= 140 -> ContextCompat.getColor(this, R.color.amber_warn)
                          else -> ContextCompat.getColor(this, R.color.red_hot)
                      }
                      binding.tvPingBadge.setTextColor(pingColor)
                  } else {
                      binding.tvPingBadge.text = "Timeout"
                      binding.tvPingBadge.setTextColor(ContextCompat.getColor(this, R.color.amber_warn))
                  }
              }

              private fun refreshFreeFireCard() {
                  when (val target = OptimizationEngine.detectFreeFire(this)) {
                      is FreeFireTarget.Installed -> binding.tvFreeFireStatus.text = "${target.label} detected • Tap to boost & play"
                      FreeFireTarget.NotInstalled -> binding.tvFreeFireStatus.text = "Not installed • Tap to view on Play Store"
                  }
              }

              private fun setupAds() {
                  binding.adBannerContainer.post {
                      val density = resources.displayMetrics.density
                      val widthDp = (binding.adBannerContainer.width / density).toInt().coerceAtLeast(320)
                      val adaptiveSize = AdSize.getLargeAnchoredAdaptiveBannerAdSize(this, widthDp)
                      val adView = AdView(this).apply {
                          adUnitId = getString(R.string.admob_banner_id)
                          setAdSize(adaptiveSize)
                      }
                      binding.adBannerContainer.removeAllViews()
                      binding.adBannerContainer.addView(adView)
                      adView.loadAd(AdRequest.Builder().build())
                      bannerAdView = adView
                  }
                  loadInterstitialAd()
              }

              private fun loadInterstitialAd() {
                  InterstitialAd.load(
                      this,
                      getString(R.string.admob_interstitial_id),
                      AdRequest.Builder().build(),
                      object : InterstitialAdLoadCallback() {
                          override fun onAdLoaded(ad: InterstitialAd) {
                              interstitialAd = ad
                              interstitialAd?.fullScreenContentCallback = object : FullScreenContentCallback() {
                                  override fun onAdDismissedFullScreenContent() {
                                      interstitialAd = null
                                      loadInterstitialAd()
                                  }
                              }
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) { interstitialAd = null }
                      }
                  )
              }

              private fun maybeShowInterstitialAfterBoost() {
                  val now = SystemClock.elapsedRealtime()
                  if (interstitialAd != null && (now - lastInterstitialShownMs) >= 180_000L) {
                      lastInterstitialShownMs = now
                      interstitialAd?.show(this)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REZWON-GAME-BOOSTER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
