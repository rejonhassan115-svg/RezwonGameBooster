          cat << 'EOF' > app/src/main/java/com/rezwon/gamebooster/SystemMonitor.kt
          package com.rezwon.gamebooster

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import android.os.SystemClock
          import android.view.WindowManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.net.InetSocketAddress
          import java.net.Socket
          import kotlin.math.roundToInt

          data class MemorySnapshot(val totalGb: Double, val usedGb: Double, val availGb: Double, val usedPercent: Int)
          data class StorageSnapshot(val totalGb: Double, val usedGb: Double, val freeGb: Double, val usedPercent: Int)
          data class BatterySnapshot(val tempCelsius: Float?, val levelPercent: Int, val isCharging: Boolean, val thermalStatus: String)
          data class CpuSnapshot(val deviceLabel: String, val cores: Int, val currentFreqMhz: Int?, val maxFreqMhz: Int?, val maxRefreshHz: Int)
          data class NetworkSnapshot(val isConnected: Boolean, val transportLabel: String, val downMbps: Double, val pingMs: Int?)

          object SystemMonitor {

              fun getMemorySnapshot(context: Context): MemorySnapshot {
                  val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val memInfo = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(memInfo)
                  val totalBytes = memInfo.totalMem.coerceAtLeast(1L)
                  val availBytes = memInfo.availMem.coerceIn(0L, totalBytes)
                  val usedBytes = totalBytes - availBytes
                  val gbFactor = 1024.0 * 1024.0 * 1024.0
                  val percent = ((usedBytes * 100.0) / totalBytes).roundToInt().coerceIn(0, 100)
                  return MemorySnapshot(totalBytes / gbFactor, usedBytes / gbFactor, availBytes / gbFactor, percent)
              }

              fun getStorageSnapshot(): StorageSnapshot {
                  return try {
                      val stat = StatFs(Environment.getDataDirectory().path)
                      val blockSize = stat.blockSizeLong
                      val totalBytes = (stat.blockCountLong * blockSize).coerceAtLeast(1L)
                      val freeBytes = (stat.availableBlocksLong * blockSize).coerceIn(0L, totalBytes)
                      val usedBytes = totalBytes - freeBytes
                      val gbFactor = 1024.0 * 1024.0 * 1024.0
                      val percent = ((usedBytes * 100.0) / totalBytes).roundToInt().coerceIn(0, 100)
                      StorageSnapshot(totalBytes / gbFactor, usedBytes / gbFactor, freeBytes / gbFactor, percent)
                  } catch (_: Exception) {
                      StorageSnapshot(0.0, 0.0, 0.0, 0)
                  }
              }

              fun parseBatteryIntent(intent: Intent?): BatterySnapshot {
                  if (intent == null) return BatterySnapshot(null, 0, false, "UNKNOWN")
                  val rawTemp = intent.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, -1)
                  val tempC = if (rawTemp > 0) rawTemp / 10f else null
                  val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                  val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, 100).coerceAtLeast(1)
                  val percent = if (level >= 0) ((level * 100f) / scale).roundToInt() else 0
                  val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                  val isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL
                  val thermalStatus = when {
                      tempC == null -> "N/A"
                      tempC >= 43f -> "HOT"
                      tempC >= 38f -> "WARM"
                      else -> "COOL"
                  }
                  return BatterySnapshot(tempC, percent, isCharging, thermalStatus)
              }

              fun getCpuSnapshot(context: Context): CpuSnapshot {
                  val manufacturer = Build.MANUFACTURER.uppercase()
                  val model = Build.MODEL
                  val deviceLabel = if (model.uppercase().startsWith(manufacturer)) model else "$manufacturer $model"
                  val cores = Runtime.getRuntime().availableProcessors()
                  val curMhz = readCpuFreqMhz("/sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq")
                  val maxMhz = readCpuFreqMhz("/sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq")
                  val refreshHz = getMaxSupportedRefreshHz(context)
                  return CpuSnapshot(deviceLabel, cores, curMhz, maxMhz, refreshHz)
              }

              private fun readCpuFreqMhz(path: String): Int? {
                  return try {
                      val file = File(path)
                      if (!file.canRead()) return null
                      val khz = file.readText().trim().toLongOrNull() ?: return null
                      (khz / 1000L).toInt()
                  } catch (_: Exception) {
                      null
                  }
              }

              fun getMaxSupportedRefreshHz(context: Context): Int {
                  return try {
                      val display = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          context.display
                      } else {
                          @Suppress("DEPRECATION")
                          (context.getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay
                      }
                      val modes = display?.supportedModes
                      val maxRate = modes?.maxOfOrNull { it.refreshRate } ?: display?.refreshRate ?: 60f
                      maxRate.roundToInt()
                  } catch (_: Exception) {
                      60
                  }
              }

              suspend fun getNetworkSnapshot(context: Context): NetworkSnapshot {
                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                  if (caps == null || !caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)) {
                      return NetworkSnapshot(false, "Offline", 0.0, null)
                  }
                  val transport = when {
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "Wi-Fi Connected"
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> "Mobile Data (4G/5G)"
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) -> "Ethernet"
                      else -> "Connected"
                  }
                  val downMbps = caps.linkDownstreamBandwidthKbps / 1000.0
                  val pingMs = measureTcpPingMs()
                  return NetworkSnapshot(true, transport, downMbps, pingMs)
              }

              private suspend fun measureTcpPingMs(): Int? = withContext(Dispatchers.IO) {
                  try {
                      Socket().use { socket ->
                          val start = SystemClock.elapsedRealtime()
                          socket.connect(InetSocketAddress("1.1.1.1", 443), 1500)
                          (SystemClock.elapsedRealtime() - start).toInt()
                      }
                  } catch (_: Exception) {
                      null
                  }
              }
          }
