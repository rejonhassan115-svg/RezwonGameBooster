name: Build REZWON APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/rezwon/gamebooster
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RezwonGameBooster"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.10" apply false
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          # ProGuard rules
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rezwon.gamebooster"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.rezwon.gamebooster"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.2.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.core:core-splashscreen:1.0.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("com.google.android.gms:play-services-ads:25.5.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <queries>
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>

              <application
                  android:name=".RezwonApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Rezwon.Splash">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="@string/admob_app_id" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_black">#040608</color>
              <color name="bg_surface">#0C1117</color>
              <color name="bg_surface_elevated">#121A23</color>
              <color name="border_subtle">#1C3426</color>
              <color name="neon_green">#00FF66</color>
              <color name="neon_green_bright">#39FF14</color>
              <color name="neon_green_dark">#009940</color>
              <color name="neon_green_tint">#1A00FF66</color>
              <color name="amber_warn">#FFB020</color>
              <color name="red_hot">#FF3B5C</color>
              <color name="cyan_net">#00E5FF</color>
              <color name="text_primary">#F2F7F4</color>
              <color name="text_secondary">#8EA397</color>
              <color name="text_muted">#5B7064</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">REZWON GAME BOOSTER</string>
              <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>
              <string name="admob_banner_id">ca-app-pub-3940256099942544/9214589741</string>
              <string name="admob_interstitial_id">ca-app-pub-3940256099942544/1033173712</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Rezwon" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="colorPrimary">@color/neon_green</item>
                  <item name="colorOnPrimary">@color/bg_black</item>
                  <item name="colorSurface">@color/bg_surface</item>
                  <item name="android:colorBackground">@color/bg_black</item>
                  <item name="android:statusBarColor">@color/bg_black</item>
                  <item name="android:navigationBarColor">@color/bg_black</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

              <style name="Theme.Rezwon.Splash" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">@color/bg_black</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/ic_launcher_foreground</item>
                  <item name="postSplashScreenTheme">@style/Theme.Rezwon</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_cyber_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/bg_surface" />
              <stroke android:width="1dp" android:color="@color/border_subtle" />
              <corners android:radius="18dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_neon_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/neon_green_tint" />
              <stroke android:width="1dp" android:color="#6600FF66" />
              <corners android:radius="100dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_boost_ring_outer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="@android:color/transparent" />
              <stroke
                  android:width="3dp"
                  android:color="@color/neon_green"
                  android:dashWidth="18dp"
                  android:dashGap="8dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_boost_button.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient
                  android:type="radial"
                  android:gradientRadius="120dp"
                  android:startColor="#173826"
                  android:endColor="#08130D" />
              <stroke
                  android:width="2.5dp"
                  android:color="@color/neon_green" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_freefire_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:angle="0"
                  android:startColor="#0E1D15"
                  android:endColor="#0A0F14" />
              <stroke android:width="1.2dp" android:color="@color/neon_green" />
              <corners android:radius="18dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_bolt.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/neon_green"
                  android:pathData="M13,2L4,14h7l-1,8 9,-12h-7l1,-8z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_gamepad.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/neon_green"
                  android:pathData="M17.5,6.5C19.99,6.5 22,8.51 22,11v4c0,1.93 -1.57,3.5 -3.5,3.5 -1.16,0 -2.23,-0.58 -2.87,-1.54L14.5,15.27H9.5l-1.13,1.69C7.73,17.92 6.66,18.5 5.5,18.5 3.57,18.5 2,16.93 2,15v-4C2,8.51 4.01,6.5 6.5,6.5h11zM8,10H6.5v1.5H5V13h1.5v1.5H8V13h1.5v-1.5H8V10zM15.5,11a1,1 0,1 0,0 2 1,1 0,0 0,0 -2zM18,13a1,1 0,1 0,0 2 1,1 0,0 0,0 -2z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#040608" android:pathData="M0,0h108v108h-108z" />
              <path android:strokeWidth="1" android:strokeColor="#143D24" android:pathData="M16,54 A38,38 0 1,0 92,54 A38,38 0 1,0 16,54 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F261A"
                  android:strokeWidth="2.5"
                  android:strokeColor="#00FF66"
                  android:pathData="M54,24 L78,34 V53 C78,68 67.5,80.5 54,85 C40.5,80.5 30,68 30,53 V34 Z" />
              <path
                  android:fillColor="#00FF66"
                  android:pathData="M57,34 L42,56 H53 L50,74 L66,51 H55 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_black">

              <androidx.core.widget.NestedScrollView
                  android:id="@+id/scrollView"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:clipToPadding="false"
                  android:paddingBottom="16dp"
                  app:layout_constraintBottom_toTopOf="@id/adBannerContainer"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:paddingHorizontal="16dp"
                      android:paddingTop="14dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <ImageView
                              android:layout_width="28dp"
                              android:layout_height="28dp"
                              android:contentDescription="@string/app_name"
                              android:src="@drawable/ic_bolt" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="10dp"
                              android:layout_weight="1"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:letterSpacing="0.06"
                                  android:text="REZWON GAME BOOSTER"
                                  android:textColor="@color/text_primary"
                                  android:textSize="17sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvDeviceHeader"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Detecting device..."
                                  android:textColor="@color/neon_green"
                                  android:textSize="12sp" />
                          </LinearLayout>

                          <TextView
                              android:id="@+id/tvSafeBadge"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:background="@drawable/bg_neon_pill"
                              android:paddingHorizontal="10dp"
                              android:paddingVertical="5dp"
                              android:text="NO ROOT • SAFE"
                              android:textColor="@color/neon_green"
                              android:textSize="10sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:background="@drawable/bg_cyber_card"
                          android:gravity="center_horizontal"
                          android:orientation="vertical"
                          android:padding="20dp">

                          <FrameLayout
                              android:layout_width="176dp"
                              android:layout_height="176dp">

                              <View
                                  android:id="@+id/ringOuter"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:background="@drawable/bg_boost_ring_outer" />

                              <LinearLayout
                                  android:id="@+id/btnBoost"
                                  android:layout_width="142dp"
                                  android:layout_height="142dp"
                                  android:layout_gravity="center"
                                  android:background="@drawable/bg_boost_button"
                                  android:clickable="true"
                                  android:focusable="true"
                                  android:foreground="?attr/selectableItemBackgroundBorderless"
                                  android:gravity="center"
                                  android:orientation="vertical">

                                  <ImageView
                                      android:id="@+id/ivBoostIcon"
                                      android:layout_width="34dp"
                                      android:layout_height="34dp"
                                      android:contentDescription="Boost"
                                      android:src="@drawable/ic_bolt" />

                                  <TextView
                                      android:id="@+id/tvBoostButton"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginTop="6dp"
                                      android:letterSpacing="0.08"
                                      android:text="ONE-TAP\nBOOST"
                                      android:textAlignment="center"
                                      android:textColor="@color/text_primary"
                                      android:textSize="14sp"
                                      android:textStyle="bold" />
                              </LinearLayout>
                          </FrameLayout>

                          <TextView
                              android:id="@+id/tvBoostStatus"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="14dp"
                              android:text="Ready for safe optimization • Cache trim, Display 120Hz &amp; Gaming Mode"
                              android:textAlignment="center"
                              android:textColor="@color/text_secondary"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:orientation="horizontal">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginEnd="6dp"
                              android:layout_weight="1"
                              android:background="@drawable/bg_cyber_card"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="RAM USAGE"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvRamPercent"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="--%"
                                  android:textColor="@color/neon_green"
                                  android:textSize="22sp"
                                  android:textStyle="bold" />

                              <ProgressBar
                                  android:id="@+id/progressRam"
                                  style="?android:attr/progressBarStyleHorizontal"
                                  android:layout_width="match_parent"
                                  android:layout_height="6dp"
                                  android:layout_marginTop="8dp"
                                  android:max="100"
                                  android:progress="0"
                                  android:progressBackgroundTint="#1E2C24"
                                  android:progressTint="@color/neon_green" />

                              <TextView
                                  android:id="@+id/tvRamDetail"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="6dp"
                                  android:text="-- / -- GB"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp" />
                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:background="@drawable/bg_cyber_card"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="CPU &amp; DISPLAY"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvFpsValue"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="-- FPS"
                                  android:textColor="@color/neon_green"
                                  android:textSize="22sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvCpuCores"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="6dp"
                                  android:text="-- Cores"
                                  android:textColor="@color/text_primary"
                                  android:textSize="12sp" />

                              <TextView
                                  android:id="@+id/tvCpuFreq"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="2dp"
                                  android:text="Clock: --"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:orientation="horizontal">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginEnd="6dp"
                              android:layout_weight="1"
                              android:background="@drawable/bg_cyber_card"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="BATTERY TEMP"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvBatteryTemp"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="-- °C"
                                  android:textColor="@color/neon_green"
                                  android:textSize="22sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvBatteryDetail"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="8dp"
                                  android:text="Level: --%"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp" />
                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:background="@drawable/bg_cyber_card"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="STORAGE"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvStorageFree"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="-- GB Free"
                                  android:textColor="@color/neon_green"
                                  android:textSize="20sp"
                                  android:textStyle="bold" />

                              <ProgressBar
                                  android:id="@+id/progressStorage"
                                  style="?android:attr/progressBarStyleHorizontal"
                                  android:layout_width="match_parent"
                                  android:layout_height="6dp"
                                  android:layout_marginTop="8dp"
                                  android:max="100"
                                  android:progress="0"
                                  android:progressBackgroundTint="#1E2C24"
                                  android:progressTint="@color/neon_green" />

                              <TextView
                                  android:id="@+id/tvStorageDetail"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="6dp"
                                  android:text="-- / -- GB used"
                                  android:textColor="@color/text_secondary"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:background="@drawable/bg_cyber_card"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:padding="14dp">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
