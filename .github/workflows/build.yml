          package com.rezwon.gamebooster

          import android.app.Activity
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.view.WindowManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import java.io.File

          data class BoostReport(val reclaimedMb: Int, val clearedCacheKb: Long, val summary: String)
          enum class DndStatus { ENABLED, DISABLED, NEEDS_PERMISSION }
          sealed class FreeFireTarget {
              data class Installed(val label: String, val packageName: String) : FreeFireTarget()
              data object NotInstalled : FreeFireTarget()
          }

          object OptimizationEngine {
              private const val PKG_FREE_FIRE = "com.dts.freefireth"
              private const val PKG_FREE_FIRE_MAX = "com.dts.freefiremax"

              suspend fun runSafeOptimization(context: Context): BoostReport = withContext(Dispatchers.IO) {
                  val beforeAvail = SystemMonitor.getMemorySnapshot(context).availGb
                  val clearedBytes = deleteCacheContents(context.cacheDir) + deleteCacheContents(context.codeCacheDir)
                  Runtime.getRuntime().gc()
                  delay(850)
                  val afterAvail = SystemMonitor.getMemorySnapshot(context).availGb
                  val reclaimedMb = ((afterAvail - beforeAvail) * 1024.0).toInt().coerceAtLeast(0)
                  val clearedKb = (clearedBytes / 1024L).coerceAtLeast(0L)
                  val summary = if (reclaimedMb > 0) {
                      "Safe Boost complete • +$reclaimedMb MB available • Cache trimmed (${clearedKb} KB)"
                  } else {
                      "Safe Boost complete • Cache trimmed (${clearedKb} KB) & Display/Gaming profile active"
                  }
                  BoostReport(reclaimedMb, clearedKb, summary)
              }

              private fun deleteCacheContents(dir: File?): Long {
                  if (dir == null || !dir.exists()) return 0L
                  var freed = 0L
                  dir.listFiles()?.forEach { child ->
                      freed += if (child.isDirectory) {
                          deleteCacheContents(child).also { child.delete() }
                      } else {
                          val len = child.length()
                          if (child.delete()) len else 0L
                      }
                  }
                  return freed
              }

              fun applyHighRefreshRate(activity: Activity, enable: Boolean) {
                  try {
                      val display = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          activity.display
                      } else {
                          @Suppress("DEPRECATION")
                          activity.windowManager.defaultDisplay
                      } ?: return
                      val currentMode = display.mode
                      val bestMode = display.supportedModes
                          .filter { it.physicalWidth == currentMode.physicalWidth && it.physicalHeight == currentMode.physicalHeight }
                          .maxByOrNull { it.refreshRate }
                      val params = activity.window.attributes
                      params.preferredDisplayModeId = if (enable && bestMode != null) bestMode.modeId else 0
                      activity.window.attributes = params
                  } catch (_: Exception) { }
              }

              fun applyHighBrightness(activity: Activity, enable: Boolean) {
                  val params = activity.window.attributes
                  params.screenBrightness = if (enable) 0.90f else WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                  activity.window.attributes = params
              }

              fun applyKeepScreenOn(activity: Activity, enable: Boolean) {
                  if (enable) activity.window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  else activity.window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              fun setGamingDnd(context: Context, enable: Boolean): DndStatus {
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (!nm.isNotificationPolicyAccessGranted) return DndStatus.NEEDS_PERMISSION
                  return try {
                      nm.setInterruptionFilter(
                          if (enable) NotificationManager.INTERRUPTION_FILTER_PRIORITY
                          else NotificationManager.INTERRUPTION_FILTER_ALL
                      )
                      if (enable) DndStatus.ENABLED else DndStatus.DISABLED
                  } catch (_: SecurityException) {
                      DndStatus.NEEDS_PERMISSION
                  }
              }

              fun openDndSettings(context: Context) {
                  val intent = Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(intent)
              }

              fun detectFreeFire(context: Context): FreeFireTarget {
                  val pm = context.packageManager
                  if (pm.getLaunchIntentForPackage(PKG_FREE_FIRE_MAX) != null) {
                      return FreeFireTarget.Installed("Free Fire MAX", PKG_FREE_FIRE_MAX)
                  }
                  if (pm.getLaunchIntentForPackage(PKG_FREE_FIRE) != null) {
                      return FreeFireTarget.Installed("Free Fire", PKG_FREE_FIRE)
                  }
                  return FreeFireTarget.NotInstalled
              }

              fun launchFreeFireOrStore(context: Context): Boolean {
                  return when (val target = detectFreeFire(context)) {
                      is FreeFireTarget.Installed -> {
                          val launchIntent = context.packageManager.getLaunchIntentForPackage(target.packageName)
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(launchIntent)
                              true
                          } else false
                      }
                      FreeFireTarget.NotInstalled -> {
                          try {
                              context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$PKG_FREE_FIRE")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          } catch (_: Exception) {
                              context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=$PKG_FREE_FIRE")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          }
                          false
                      }
                  }
              }
          }
